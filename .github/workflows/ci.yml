name: ci

on:
  # Every pull request, the release one included: release-please opens it with the release App's
  # token (see release-please.yml), so its runs start without approval and its checks are real.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs supersede each other: the group is the ref, and a new push cancels the run
# of the commit it replaced. Each push to main runs in a group of its own, so it neither waits on
# nor cancels the run before it, and every commit on main keeps its verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run validate
      - run: bun run tokens:check
      - run: bun run registry:validate
      - run: bun run registry:build
      - run: bun run validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry
          path: public/r

  # A clean consumer per locked style installs the flattened build and renders every item.
  consumer-matrix:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        style: [radix-nova, base-mira, base-vega]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registry
          path: public/r
      - run: bash scripts/ci/consumer-matrix.sh ${{ matrix.style }}

  # tradecn.dev as this commit would publish it: the pages, the embedded previews, and a browser
  # pass over every preview. The release job builds the same thing from the tag.
  site:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd playground build:embed
      - run: bun scripts/site/build.ts
      - run: bun scripts/site/build.ts --base "/v$(cat version.txt)" --out "site/dist/v$(cat version.txt)"
      - run: bunx playwright install --with-deps chromium
      - run: bun scripts/site/smoke.ts

  # The real distribution path, against this exact commit.
  github-form:
    needs: verify
    if: github.repository == 'tradecn/ui' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read the catalog from the commit the CLI installs, not the PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bash scripts/ci/github-form.sh ${{ github.event.pull_request.head.sha || github.sha }}

  # The tradecn.dev stack, synthesized on every pull request whatever it touches, so a change to
  # infra/ or site/headers.json cannot merge unsynthesized behind the one required check.
  # infra.yml deploys it on push.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --cwd infra
      - run: bun run --cwd infra typecheck
      - run: bun run --cwd infra synth

  # The one check to require, and the one auto-merge waits on. Green only when every job above is
  # green and, on a pull request, the title and body pass scripts/ci/pull-request.ts as they read
  # now: a title fixed after this ran stays red here until the job reruns.
  passed:
    name: CI passed
    needs: [verify, consumer-matrix, site, github-form, infra]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The title and body as they read now
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          PR_TITLE="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""')"
          export PR_TITLE PR_BODY
          bun scripts/ci/pull-request.ts || {
            echo "::error::Fix the title or body, then rerun this job. It reads them as they are now."
            exit 1
          }
      - name: Every job
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          # github-form skips itself on a pull request from a fork, whose commit the CLI cannot install by ref.
          MAY_SKIP: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'github-form' || '' }}
        run: bun scripts/ci/passed.ts
