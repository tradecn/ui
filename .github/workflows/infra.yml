name: infra

# The tradecn.dev stack. Content is published by the deploy job in release-please.yml.
on:
  pull_request:
    paths:
      - infra/**
      - site/headers.json
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/**
      # The stack reads the security headers from here, so a policy change has to redeploy it.
      - site/headers.json
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  AWS_REGION: us-east-1

jobs:
  # No credentials: the stack names its hosted zone instead of looking it up.
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --cwd infra
      - run: bun run --cwd infra typecheck
      - run: bun run --cwd infra synth

  deploy:
    needs: synth
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: tradecn-dev-infra
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --cwd infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: tradecn-infra-${{ github.run_id }}
      - run: bun run --cwd infra deploy
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
