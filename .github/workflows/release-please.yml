name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to tradecn.dev, e.g. v0.1.2. The latest pointer moves only if it is the highest tag."
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  AWS_REGION: us-east-1
  SITE_URL: https://tradecn.dev
  STACK_NAME: TradecnSiteStack

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # tradecn.dev serves releases only. GitHub starts no workflow from a tag its own token pushed, so
  # the publish rides in the run that made the release. /r/<tag>/ is written for every tag; the
  # latest pointer and the landing page move only when the tag is the highest in the repo.
  deploy:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: tradecn-dev-content
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
      # main: the page templates, the builder, and the install proof.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag: its registry source, built with its own pinned CLI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build the registry from the tag
        working-directory: release
        run: |
          bun install --frozen-lockfile
          bun run registry:build
          test -f public/r/registry.json
      - name: Build the pages for the tag
        run: |
          bun install --frozen-lockfile
          bun scripts/site/build.ts --registry release/registry.json --version release/version.txt --docs release/docs --out site/dist
      - name: Find the highest tag
        id: highest
        run: |
          highest="$(git ls-remote --tags --refs origin 'v*' | awk -F/ '{print $NF}' | sort -V | tail -1)"
          echo "highest=$highest" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG. Highest tag: $highest." >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: tradecn-release-${{ github.run_id }}
      - name: Read the stack outputs
        id: stack
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(output SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(output DistributionId)" >> "$GITHUB_OUTPUT"
      - name: Publish /r/${{ env.TAG }}/
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync release/public/r "s3://$BUCKET/r/$TAG" \
            --content-type application/json --cache-control "public, max-age=31536000, immutable"
      - name: Move the latest pointer and the page
        if: steps.highest.outputs.highest == env.TAG
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          aws s3 sync release/public/r "s3://$BUCKET/r" --delete --exclude "v*/*" \
            --content-type application/json --cache-control "public, max-age=300"
          aws s3 sync site/dist "s3://$BUCKET" --delete --exclude "r/*" \
            --cache-control "no-cache, no-store, must-revalidate"
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/" "/index.html" "/404.html" "/favicon.svg" "/docs/*" "/r/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "Latest pointer and page moved to $TAG." >> "$GITHUB_STEP_SUMMARY"
      - name: Install every item through the namespace
        run: bash scripts/ci/namespace-form.sh "$SITE_URL" "$TAG"
