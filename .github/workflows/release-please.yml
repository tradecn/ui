name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to tradecn.dev, e.g. v0.1.2. The latest pointer moves only if it is the highest tag."
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  AWS_REGION: us-east-1
  SITE_URL: https://tradecn.dev
  STACK_NAME: TradecnSiteStack

jobs:
  # The release pull request is opened and refreshed with the release App's token, not the workflow
  # token. GitHub parks every workflow run on a pull request that github-actions[bot] opened or
  # pushed to until someone with write access approves it, so a release pull request opened with
  # the workflow token waited on a click before ci could start. The App is another actor: ci and
  # pull-request run on its pull request as on any other, and the checks the ruleset requires come
  # from there. The App holds contents, pull requests, and issues (the labels) on this repository
  # only; the token asks for exactly those and is revoked when the job ends.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # tradecn.dev serves releases only. The publish rides in the run that made the release: this run
  # knows the tag, and no workflow listens for one. /r/<tag>/ is written for every tag; the latest
  # pointer and the landing page move only when the tag is the highest in the repo.
  deploy:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: tradecn-dev-content
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
      # main: the page templates, the builder, and the install proof.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag: its registry source, built with its own pinned CLI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build the registry from the tag
        working-directory: release
        run: |
          bun install --frozen-lockfile
          bun run registry:build
          test -f public/r/registry.json
      # The previews are the tag's demos over the tag's registry source. A tag from before they
      # existed has no embed config, and its pages go out without them. The bundle takes a relative
      # base, so one build serves /preview/assets/ at the root and under /<tag>/ alike (a chunk finds
      # the next by its own URL); a tag whose config still says /preview/ takes the base from here.
      - name: Build the previews from the tag
        working-directory: release
        run: |
          if [ -f playground/vite.embed.config.ts ]; then
            bun run --cwd playground build:embed -- --base ./
          else
            echo "$TAG predates the embedded previews; its docs pages carry none." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Find the highest tag
        id: highest
        run: |
          highest="$(git ls-remote --tags --refs origin 'v*' | awk -F/ '{print $NF}' | sort -V | tail -1)"
          echo "highest=$highest" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG. Highest tag: $highest." >> "$GITHUB_STEP_SUMMARY"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: tradecn-release-${{ github.run_id }}
      - name: Read the stack outputs
        id: stack
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(output SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(output DistributionId)" >> "$GITHUB_OUTPUT"
      # Every release with pages, newest first, this one among them: what the header's menu lists and
      # what /versions.json names. Read off the bucket, so a re-run and a backfill of an older tag both
      # keep the list whole.
      - name: List the releases with pages
        id: versions
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          published="$(aws s3api list-objects-v2 --bucket "$BUCKET" --delimiter / --prefix v --query 'CommonPrefixes[].Prefix' --output text \
            | tr '\t' '\n' | sed 's#/$##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          versions="$(printf '%s\n%s\n' "$published" "$TAG" | grep . | sort -V -r -u | paste -sd, -)"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Releases with pages: $versions." >> "$GITHUB_STEP_SUMMARY"
      # Two trees from the same inputs: the root's, which the latest release owns, and the tag's own
      # under /<tag>/ with every path moved under it, so a release's pages stay up beside the latest.
      - name: Build the pages for the tag
        env:
          VERSIONS: ${{ steps.versions.outputs.versions }}
        run: |
          bun install --frozen-lockfile
          build() {
            bun scripts/site/build.ts --registry release/registry.json --version release/version.txt --docs release/docs \
              --changelog release/CHANGELOG.md --demos release/playground/src/demos --embed release/playground/dist/embed \
              --versions "$VERSIONS" "$@"
          }
          build --out site/dist
          build --out "site/dist/$TAG" --base "/$TAG"
      - name: Publish /r/${{ env.TAG }}/
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          aws s3 sync release/public/r "s3://$BUCKET/r/$TAG" \
            --content-type application/json --cache-control "public, max-age=31536000, immutable"
      # The tag's own pages, for every tag: the bundle for good, the fonts for a day, the pages fresh, as
      # the root's are. Then the list of releases at the root, so every tree's menu offers this one.
      - name: Publish /${{ env.TAG }}/
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          if [ -d "site/dist/$TAG/preview/assets" ]; then
            aws s3 sync "site/dist/$TAG/preview/assets" "s3://$BUCKET/$TAG/preview/assets" --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 sync "site/dist/$TAG/fonts" "s3://$BUCKET/$TAG/fonts" --delete \
            --content-type font/woff2 --cache-control "public, max-age=86400"
          aws s3 sync "site/dist/$TAG" "s3://$BUCKET/$TAG" --delete --exclude "preview/assets/*" --exclude "fonts/*" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp site/dist/versions.json "s3://$BUCKET/versions.json" \
            --content-type application/json --cache-control "public, max-age=300"
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/$TAG" "/$TAG/*" "/versions.json" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "Pages for $TAG at /$TAG/." >> "$GITHUB_STEP_SUMMARY"
      # The root: the latest release's pages, and the pointers. The trees under /vX.Y.Z/ and the list of
      # releases are not the root's to write or delete, so the sync leaves them alone.
      - name: Move the latest pointer and the page
        if: steps.highest.outputs.highest == env.TAG
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          aws s3 sync release/public/r "s3://$BUCKET/r" --delete --exclude "v*/*" \
            --content-type application/json --cache-control "public, max-age=300"
          # The preview bundle is content-hashed, so it can be cached for good; the pages cannot.
          if [ -d site/dist/preview/assets ]; then
            aws s3 sync site/dist/preview/assets "s3://$BUCKET/preview/assets" --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi
          # The pages' two faces change only with the Fontsource packages, so a day's cache is enough and the invalidation covers a change.
          aws s3 sync site/dist/fonts "s3://$BUCKET/fonts" --delete \
            --content-type font/woff2 --cache-control "public, max-age=86400"
          aws s3 sync site/dist "s3://$BUCKET" --delete --exclude "r/*" --exclude "preview/assets/*" --exclude "fonts/*" \
            --exclude "v[0-9]*/*" --exclude "versions.json" \
            --cache-control "no-cache, no-store, must-revalidate"
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/" "/index.html" "/404.html" "/favicon.svg" "/site.js" "/site.css" "/theme.js" "/fonts.css" "/fonts/*" "/search.json" "/popout.html" "/docs/*" "/preview/*" "/r/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "Latest pointer and page moved to $TAG." >> "$GITHUB_STEP_SUMMARY"
      - name: Install every item through the namespace
        run: bash scripts/ci/namespace-form.sh "$SITE_URL" "$TAG"
      # The previews, live: each one mounts on tradecn.dev and the docs page frames it.
      - name: Check every preview on the live site
        if: steps.highest.outputs.highest == env.TAG && hashFiles('site/dist/preview/**/index.html') != ''
        run: |
          bunx playwright install --with-deps chromium
          SMOKE_ITEMS="$(ls -d site/dist/preview/*/ | xargs -n1 basename | grep -v '^assets$' | paste -sd, -)" \
            bun scripts/site/smoke.ts --base "$SITE_URL"
