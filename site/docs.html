<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · tradecn/ui</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{siteUrl}}{{path}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
{{palette}}
  --font-sans: {{fontSans}};
  --font-mono: {{fontMono}};
}
</style>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/site.css">
<!-- Blocking, in the head: the mode is on <html> before anything paints, the page is listening for a
     preview's height before the iframe exists, and it knows the reader's package manager before the
     first install block is parsed. -->
<script src="/theme.js"></script>
<script src="/site.js"></script>
</head>
<body>
{{header}}
{{search}}
<div class="wrap page">
  <aside class="sidebar" aria-label="Docs">
{{nav}}
  </aside>
  <article>
{{content}}
{{foot}}
  </article>
  <aside class="toc" aria-label="On this page">
{{toc}}
  </aside>
</div>
</body>
</html>
