<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · tradecn/ui</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="{{siteUrl}}{{path}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
{{palette}}
  --font: {{font}};
}
</style>
<link rel="stylesheet" href="/site.css">
<!-- Blocking, in the head, so the page is listening for a preview's height before the iframe exists,
     and knows the reader's package manager before the first install block is parsed. -->
<script src="/site.js"></script>
</head>
<body>
{{header}}
<div class="wrap page">
  <aside class="sidebar" aria-label="Docs">
{{nav}}
  </aside>
  <article>
{{content}}
{{foot}}
  </article>
  <aside class="toc" aria-label="On this page">
{{toc}}
  </aside>
</div>
</body>
</html>
