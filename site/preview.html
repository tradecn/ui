<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{item}} · tradecn/ui preview</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Blocking, before the bundle: the mode class and the theme are on <html> before the demo mounts, from the same choices the page around this made. -->
{{themesMeta}}
<script src="/theme.js"></script>
{{styles}}
<style>
/* After the bundle's stylesheet on purpose: these beat its palette and its @theme fonts, the way a theme
   item's variables beat the defaults in a consumer's stylesheet. Both sides are the site theme's whole
   palette over the bundle's, or a theme's own on that theme's page; then every other theme's two sides,
   keyed on the data-theme theme.js puts on <html> beside the mode class, so a preview wears what the page
   around it chose. A theme's own page carries no other theme and wears its own whatever the choice. */
:root.dark {
  color-scheme: dark;
{{darkPalette}}
}
:root.light {
  color-scheme: light;
{{lightPalette}}
}
{{themePalettes}}
body { margin: 0; }
/* A card's frame: the demo centered with room around it, in at least the card's own height, so a small demo
   does not sit in a corner of a frame the page sized to it; a taller demo grows the frame, since the height the
   embed reports is this element's. Column flex, so a demo that renders several roots stacks them, a full-width
   one stays full width, and a narrow one is centered. The desk on the opening page fills its frame. */
#root[data-frame="card"] { box-sizing: border-box; min-height: 22rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1rem; }
#root[data-frame="card"] > * { max-width: 100%; }
#root[data-frame="desk"] { padding: 1rem; }
</style>
</head>
<body>
<div id="root" data-item="{{item}}" data-frame="{{frame}}"></div>
<script type="module" src="{{script}}"></script>
</body>
</html>
