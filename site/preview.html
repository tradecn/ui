<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{item}} · tradecn/ui preview</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Blocking, before the bundle: the mode class and the theme are on <html> before the demo mounts, from the same choices the page around this made. -->
{{themesMeta}}
<script src="/theme.js"></script>
{{styles}}
<style>
/* After the bundle's stylesheet on purpose: these beat its palette and its @theme fonts, the way a theme
   item's variables beat the defaults in a consumer's stylesheet. Both sides are the site theme's whole
   palette over the bundle's, or a theme's own on that theme's page; then every other theme's two sides,
   keyed on the data-theme theme.js puts on <html> beside the mode class, so a preview wears what the page
   around it chose. A theme's own page carries no other theme and wears its own whatever the choice. */
:root.dark {
  color-scheme: dark;
{{darkPalette}}
}
:root.light {
  color-scheme: light;
{{lightPalette}}
}
{{themePalettes}}
body { margin: 0; }
/* A card's frame, shadcn's contract: the demo is centered on both axes in at least the card's own height, and a
   demo that wants the frame's width says so with `w-full` on its root, since a centered root shrinks to its
   content. A demo's controls, a `data-demo-controls` element first in its fragment, sit in a bar pinned to the
   frame's top edge, apart from the component they drive, so a reader never takes them for part of it. A taller
   demo grows the frame, since the height the embed reports is this element's. The desk fills its frame. */
#root[data-frame="card"] { box-sizing: border-box; min-height: 14rem; display: flex; flex-direction: column; padding: 1.5rem 1rem; }
#root[data-frame="card"] > * { max-width: 100%; margin: auto; }
#root[data-frame="card"] > [data-demo-controls] { order: -1; align-self: stretch; max-width: none; margin: -1.5rem -1rem 1.5rem; padding: .5rem .75rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; border-bottom: 1px solid var(--border); }
/* Shared placement preference: component contents move; both kinds of controls stay in the toolbar. */
:root[data-preview-align="left"] #root[data-frame="card"] > :not([data-demo-controls]):not([data-preview-controls]) { margin-left: 0; margin-right: auto; }
:root[data-preview-align="right"] #root[data-frame="card"] > :not([data-demo-controls]):not([data-preview-controls]) { margin-left: auto; margin-right: 0; }
/* A tag from before the centering contract, with no frame.json beside its demos: they set no w-full and know no
   controls bar, so the frame stretches them as the card did then, centered on the height alone. */
#root[data-frame="stretch"] { box-sizing: border-box; min-height: 14rem; display: flex; flex-direction: column; justify-content: center; padding: 1.5rem 1rem; }
#root[data-frame="stretch"] > * { max-width: 100%; }
#root[data-frame="desk"] { padding: 1rem; }
</style>
</head>
<body>
<div id="root" data-item="{{item}}" data-frame="{{frame}}"></div>
<script type="module" src="{{script}}"></script>
</body>
</html>
