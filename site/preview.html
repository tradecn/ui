<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{item}} · tradecn/ui preview</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{styles}}
<style>
/* After the bundle's stylesheet on purpose: these beat its palette and its @theme fonts, the way a theme
   item's variables beat the defaults in a consumer's stylesheet. */
:root {
{{palette}}
}
body { margin: 0; }
</style>
</head>
<body>
<div id="root" data-item="{{item}}" class="p-4"></div>
<script type="module" src="{{script}}"></script>
</body>
</html>
